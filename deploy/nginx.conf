# price-agent 生产反代配置
# 挂载到 nginx 容器 /etc/nginx/conf.d/default.conf
#
# 前端约定（来自 frontend-web/vite.config.js 与 src/utils/api.js）：
#   - Vite base = /price-agent/ → 页面/路由/静态资源都在 /price-agent/ 下
#   - 前端 API 全部走【根路径】同源相对路径（/auth、/cart、/items、/chat、/uploads ...）
#     → 本配置里 /price-agent/ 交给静态文件，其余路径全部反代到后端
server {
    listen 80;
    server_name _;

    # 上传 2MB 硬上限在应用层，nginx 默认 1m 会提前 413，留余量
    client_max_body_size 5m;

    # 根路径 → 前端首页
    location = / { return 302 /price-agent/; }
    location = /price-agent { return 302 /price-agent/; }

    # 前端 SPA：history 路由兜底（刷新 / 直达子路由都回 index.html）
    location /price-agent/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /price-agent/index.html;
    }

    # 其余全部转后端（API、/docs、/health、/static 等都在后端）
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式对话（POST /chat/stream）必须关缓冲，否则前端收不到增量
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
