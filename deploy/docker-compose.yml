# ════════════════════════════════════════════════════════════════
# price-agent 服务器部署（Docker Compose）
#
# 用法：
#   1. cp .env.example .env        # 填好全部真实密钥（必填项缺了会报错）
#   2. docker compose up -d --build
#   3. 访问 http://<服务器IP>/price-agent/
#
# 架构：MySQL(事实源) + PostgreSQL16+pgvector(向量副本) + Redis(arq 队列)
#       + FastAPI 后端 + arq worker + 补偿 reaper + nginx(前端+反代)
# 详见 deploy/README.md
# ════════════════════════════════════════════════════════════════
name: price-agent

services:
  # ── MySQL 8：业务数据唯一事实源（库名 price_agent，utf8mb4/0900_ai_ci）──
  mysql:
    image: mysql:8.0
    container_name: pa-mysql
    restart: unless-stopped
    # 2C2G 服务器内存预算：见 deploy/README.md §10（cap 是上限不是预占）
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?deploy/.env 里必须填 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: price_agent
      # 应用专用账号（后端不连 root），只对 price_agent 库有权限
      MYSQL_USER: price_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?deploy/.env 里必须填 MYSQL_APP_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # 对外直连 MySQL（演示/管理用）：映射到宿主机所有网卡
    # ⚠️ 必须同时：① 安全组 3306 只放行自己/评委 IP（别开 0.0.0.0/0）
    #             ② 用 price_app 账号连接（密码在 deploy/.env 的 MYSQL_APP_PASSWORD），勿用 root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── PostgreSQL 16 + pgvector：embedding 副本库（事实源始终是 MySQL）──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pa-postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:?deploy/.env 里必须填 PG_PASSWORD}
      POSTGRES_DB: price_agent_pg
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次建库自动执行 scripts/pg_init.sql（幂等，可重复跑）；
      # 若此前已手动初始化过，本脚本不破坏任何已有数据
      - ../scripts/pg_init.sql:/docker-entrypoint-initdb.d/01_pg_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d price_agent_pg"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── Redis：arq 任务队列（唯一通道，缺了索引 worker 完全跑不起来）──
  redis:
    image: redis:7-alpine
    container_name: pa-redis
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?deploy/.env 里必须填 REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── FastAPI 后端（容器启动时先跑 alembic 迁移，再起服务）──
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: pa-backend
    restart: unless-stopped
    mem_limit: 384m
    env_file: ./.env
    environment:
      # 容器内通过服务名访问各数据库（服务名即 DNS 名）
      DB_URL: mysql+aiomysql://price_app:${MYSQL_APP_PASSWORD}@mysql:3306/price_agent?charset=utf8mb4
      PG_URL: postgresql+asyncpg://postgres:${PG_PASSWORD}@postgres:5432/price_agent_pg
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 先迁移后启动；--workers 1 是刻意的：
    #   限流 / A5 日限次是进程内计数，多 worker 会把配额稀释 N 倍（README 已知问题）
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log"
    healthcheck:
      # 用 Python 标准库做健康检查（不依赖 curl，避免构建时 apt 拉 Debian 官方源超时）
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # ── RAG 索引 worker（arq，消费 Redis 队列）──
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: pa-worker
    restart: unless-stopped
    mem_limit: 256m
    env_file: ./.env
    environment:
      DB_URL: mysql+aiomysql://price_app:${MYSQL_APP_PASSWORD}@mysql:3306/price_agent?charset=utf8mb4
      PG_URL: postgresql+asyncpg://postgres:${PG_PASSWORD}@postgres:5432/price_agent_pg
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "app.worker.WorkerSettings"]

  # ── 补偿 reaper（每 5 分钟扫一次僵死/失败的索引任务，启动先扫一轮）──
  reaper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: pa-reaper
    restart: unless-stopped
    mem_limit: 128m
    env_file: ./.env
    environment:
      DB_URL: mysql+aiomysql://price_app:${MYSQL_APP_PASSWORD}@mysql:3306/price_agent?charset=utf8mb4
      PG_URL: postgresql+asyncpg://postgres:${PG_PASSWORD}@postgres:5432/price_agent_pg
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker_reaper"]

  # ── nginx：托管前端静态 + 反代后端 API（配置见 deploy/nginx.conf）──
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: pa-nginx
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      # 配 HTTPS 时放开 443，并挂载证书目录（见 deploy/README.md 第 6 节）
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro   # HTTPS 时放开
    depends_on:
      - backend

# ── 持久化数据卷：数据不随容器销毁，备份/迁移只动这些卷 ──
volumes:
  mysql_data:
  pg_data:
  redis_data:
  uploads_data:
