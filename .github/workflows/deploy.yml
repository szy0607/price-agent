name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 不用 setup-node 的 npm 缓存：曾因缓存内 tarball 损坏导致 EINTEGRITY 稳定复现，
      # 且本项目依赖量小，缓存收益可忽略，故每次全量拉取最稳。
      - name: Clean npm cache
        run: npm cache clean --force
      - run: npm ci
      - run: npm run build
      # SPA 兜底：history 路由在 GitHub Pages 下刷新/直达子路由时回退到 index.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
